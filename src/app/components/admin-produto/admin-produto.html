<div class="admin-container">
  <h2>Painel Administrativo - Cadastrar Produto</h2>

  <form [formGroup]="produtoForm" (ngSubmit)="salvarProduto()">
    <div class="form-group">
      <label>Nome do Produto:</label>
      <input type="text" formControlName="nome" placeholder="Ex: Bolo de Chocolate">
    </div>

    <div class="form-group">
      <label>Descrição:</label>
      <textarea formControlName="descricao" placeholder="Detalhes do produto..."></textarea>
    </div>

    <div class="form-group">
      <label>Preço (R$):</label>
      <input type="number" formControlName="preco" placeholder="0.00">
    </div>

    <div class="form-group">
      <label>Foto do Produto:</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*">
    </div>

    <button type="submit" [disabled]="produtoForm.invalid">Salvar Produto na Nuvem</button>
  </form>

  <p *ngIf="mensagemSucesso" class="sucesso">{{ mensagemSucesso }}</p>
</div>
